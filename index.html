<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0b13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Nova — мессенджер</title>
<style>
:root{color-scheme:dark;--bg:#0c0b13;--muted:#9995ad;--line:#292638;--text:#f7f5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}
button,input{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:520px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(160deg,#171326 0,#0c0b13 36%)}
header{padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center;font-size:25px;font-weight:800;letter-spacing:-1px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#b48aff,#7545ec);display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 7px 25px #8054ed55}
.status{font-size:11px;color:#b9a7ff;background:#32234f;padding:7px 10px;border-radius:20px}
.search{margin:8px 16px 14px;background:#1b1927;border:1px solid var(--line);border-radius:14px;padding:0 13px;display:flex;align-items:center;gap:9px}.search input{width:100%;background:none;border:0;outline:0;color:white;padding:13px 0}
.filters{display:flex;gap:8px;padding:0 16px 15px;overflow:auto}.filter{border:1px solid var(--line);background:#171522;color:#aaa5bb;border-radius:20px;padding:8px 14px;white-space:nowrap}.filter.active{background:#7650d7;border-color:#7650d7;color:white}
main{flex:1;padding:0 10px 90px}.section{font-size:11px;letter-spacing:1.4px;color:#79748c;padding:9px 10px}
.chat{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:16px;cursor:pointer}.chat:active{background:#211d30}.avatar{width:48px;height:48px;flex:none;border-radius:17px;display:grid;place-items:center;font-weight:750;font-size:17px;background:linear-gradient(135deg,#7754c9,#35294f)}.avatar.green{background:linear-gradient(135deg,#348d80,#234b53)}.avatar.orange{background:linear-gradient(135deg,#b56b43,#55392e)}.chatinfo{min-width:0;flex:1}.chatline{display:flex;justify-content:space-between;gap:8px}.chatname{font-weight:650}.time,.preview{font-size:12px;color:var(--muted)}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{background:#835cf0;color:white;border-radius:20px;font-size:11px;padding:3px 7px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:12px 22px calc(env(safe-area-inset-bottom) + 12px);background:#14121dee;border-top:1px solid var(--line);display:flex;justify-content:space-around;backdrop-filter:blur(18px)}nav button{border:0;background:none;color:#8f899f;font-size:11px;display:grid;gap:5px;justify-items:center}nav button.active{color:#b99aff}nav b{font-size:19px;font-weight:500}
.fab{position:fixed;right:max(22px,calc((100vw - 520px)/2 + 22px));bottom:94px;width:54px;height:54px;border:0;border-radius:18px;background:linear-gradient(135deg,#b28aff,#7546e9);font-size:27px;box-shadow:0 8px 25px #7b4ee866}
.view{display:none;position:fixed;inset:0;background:var(--bg);z-index:4;max-width:520px;margin:auto;flex-direction:column}.view.open{display:flex}.viewhead{padding:calc(env(safe-area-inset-top) + 15px) 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.back{border:0;background:none;font-size:25px}.messages{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:11px 14px;border-radius:17px;background:#211e2d;align-self:flex-start;line-height:1.4}.bubble.mine{align-self:flex-end;background:#6543bd}.bubble small{display:block;text-align:right;color:#d4c7f8;font-size:10px;margin-top:4px}.composer{display:flex;gap:9px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:#151320;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:22px;background:#211e2d;padding:12px 15px;color:white;outline:0}.send{border:0;background:#8055e9;border-radius:50%;width:44px;height:44px;font-size:19px}
.notice{margin:16px;padding:13px 14px;background:#211b32;border:1px solid #3a2b59;border-radius:14px;color:#c9b8f5;font-size:12px;line-height:1.5}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">N</div>Nova</div><div class="status">● DEMO</div></header>
<div class="search">⌕ <input id="search" placeholder="Поиск чатов" aria-label="Поиск чатов"></div>
<div class="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="personal">Личные</button><button class="filter" data-filter="groups">Группы</button><button class="filter" data-filter="channels">Каналы</button></div>
<main><div class="section">СООБЩЕНИЯ</div><div id="chatlist"></div><div class="notice">Демонстрационная версия Nova. Сообщения сохраняются только на этом устройстве. Для настоящей переписки между разными телефонами нужно подключить сервер.</div></main>
<button class="fab" id="newchat" aria-label="Новый чат">＋</button>
<nav><button class="active"><b>◉</b>Чаты</button><button><b>♧</b>Контакты</button><button><b>◌</b>Звонки</button><button><b>⚙</b>Настройки</button></nav>
</div>
<section class="view" id="chatview"><div class="viewhead"><button class="back" id="back">‹</button><div class="avatar" id="chatavatar">A</div><div><b id="chattitle">Чат</b><div class="time">демо-режим</div></div></div><div class="messages" id="messages"></div><form class="composer" id="sendform"><input id="messageinput" autocomplete="off" placeholder="Сообщение…"><button class="send" aria-label="Отправить">➤</button></form></section>
<script>
const defaults=[{id:1,name:"Александр",initial:"А",color:"",type:"personal",text:"Привет! Как дела?",time:"12:40",unread:2},{id:2,name:"Команда Nova",initial:"N",color:"green",type:"groups",text:"Добро пожаловать в наш чат",time:"Вчера",unread:0},{id:3,name:"Новости",initial:"Н",color:"orange",type:"channels",text:"Последние обновления проекта",time:"Пн",unread:0}];
let chats=JSON.parse(localStorage.getItem("nova-chats")||"null")||defaults,active=null,filter="all";
function save(){localStorage.setItem("nova-chats",JSON.stringify(chats))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const q=document.getElementById("search").value.toLowerCase();document.getElementById("chatlist").innerHTML=chats.filter(c=>(filter==="all"||c.type===filter)&&c.name.toLowerCase().includes(q)).map(c=>'<div class="chat" data-id="'+c.id+'"><div class="avatar '+c.color+'">'+esc(c.initial)+'</div><div class="chatinfo"><div class="chatline"><span class="chatname">'+esc(c.name)+'</span><span class="time">'+esc(c.time)+'</span></div><div class="chatline"><div class="preview">'+esc(c.text)+'</div>'+(c.unread?'<span class="unread">'+c.unread+'</span>':'')+'</div></div></div>').join("");document.querySelectorAll(".chat").forEach(el=>el.onclick=()=>openChat(+el.dataset.id))}
function openChat(id){active=chats.find(c=>c.id===id);active.unread=0;document.getElementById("chattitle").textContent=active.name;document.getElementById("chatavatar").textContent=active.initial;document.getElementById("chatview").classList.add("open");renderMessages();render()}
function renderMessages(){let box=document.getElementById("messages");box.innerHTML=(active.messages||[{mine:false,text:active.text,time:active.time}]).map(m=>'<div class="bubble '+(m.mine?"mine":"")+'">'+esc(m.text)+'<small>'+esc(m.time)+'</small></div>').join("");box.scrollTop=box.scrollHeight}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
document.getElementById("search").oninput=render;document.getElementById("back").onclick=()=>document.getElementById("chatview").classList.remove("open");
document.getElementById("sendform").onsubmit=e=>{e.preventDefault();let input=document.getElementById("messageinput"),v=input.value.trim();if(!v)return;active.messages=active.messages||[{mine:false,text:active.text,time:active.time}];active.messages.push({mine:true,text:v,time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})});active.text=v;active.time="сейчас";save();input.value="";renderMessages();render()};
document.getElementById("newchat").onclick=()=>{let name=prompt("Название нового чата");if(!name||!name.trim())return;let c={id:Date.now(),name:name.trim(),initial:name.trim()[0].toUpperCase(),color:"",type:"personal",text:"Новый чат",time:"сейчас",unread:0,messages:[]};chats.unshift(c);save();render();openChat(c.id)};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));render();
</script></body></html>
